{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-glass" style="max-width: 400px;">
        <div class="text-center mb-4">
            <div class="auth-logo"><i class="bi bi-shield-check"></i></div>
            <h2 class="fw-bold">Reset Password</h2>
            <p class="text-muted">Approved for: {{ user.full_name }}</p>
        </div>
        <form method="POST" action="{{ url_for('reset_password', token=token) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <div class="input-group">
                    <input type="password" name="password" class="form-control password-field" placeholder="New password" required>
                    <button type="button" class="btn btn-outline-secondary toggle-password"><i class="bi bi-eye"></i></button>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <div class="input-group">
                    <input type="password" name="confirm_password" class="form-control password-field" placeholder="Confirm password" required>
                    <button type="button" class="btn btn-outline-secondary toggle-password"><i class="bi bi-eye"></i></button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-glow">Reset Password</button>
        </form>
    </div>
</div>
{% endblock %}
