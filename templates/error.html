{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-glass text-center" style="max-width: 420px;">
        <div class="auth-logo"><i class="bi bi-emoji-frown"></i></div>
        <div class="display-4 fw-bold text-wa-green">{{ code }}</div>
        <h4 class="fw-bold mt-1">{{ title }}</h4>
        <p class="text-muted">{{ message }}</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary btn-glow w-100"><i class="bi bi-house"></i> Back to home</a>
    </div>
</div>
{% endblock %}
